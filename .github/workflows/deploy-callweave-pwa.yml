name: Deploy Callweave PWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/CallweavePWA/**'
      - '.github/workflows/deploy-callweave-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: callweave-pwa-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/CallweavePWA
      - id: deployment
        uses: actions/deploy-pages@v4
